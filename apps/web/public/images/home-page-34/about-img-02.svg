<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="card-clip">
      <rect rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
  </g>

  <!-- Decorative glow circles -->
  <circle cx="650" cy="150" r="180" fill="#6366f1" opacity="0.12"/>
  <circle cx="100" cy="750" r="200" fill="#22d3ee" opacity="0.08"/>

  <!-- Header bar / dashboard chrome -->
  <rect x="60" y="60" width="680" height="48" rx="12" fill="#1e293b" opacity="0.9"/>
  <circle cx="90" cy="84" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="112" cy="84" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="134" cy="84" r="7" fill="#22c55e" opacity="0.8"/>
  <rect x="160" y="76" width="280" height="16" rx="8" fill="#334155" opacity="0.8"/>

  <!-- Metric cards row -->
  <!-- Card 1: Tickets Resolved -->
  <rect x="60" y="130" width="200" height="110" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="130" width="200" height="4" rx="2" fill="url(#card1)"/>
  <text x="80" y="165" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Tickets Resolved</text>
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">2.18M</text>
  <text x="80" y="222" font-family="system-ui, sans-serif" font-size="12" fill="#34d399">↑ 24% this month</text>

  <!-- Card 2: Response Time -->
  <rect x="280" y="130" width="200" height="110" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="280" y="130" width="200" height="4" rx="2" fill="url(#card2)"/>
  <text x="300" y="165" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Avg Response Time</text>
  <text x="300" y="200" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">1.4s</text>
  <text x="300" y="222" font-family="system-ui, sans-serif" font-size="12" fill="#34d399">↓ 62% faster</text>

  <!-- Card 3: CSAT Score -->
  <rect x="500" y="130" width="240" height="110" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="500" y="130" width="240" height="4" rx="2" fill="url(#card3)"/>
  <text x="520" y="165" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">CSAT Score</text>
  <text x="520" y="200" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">94%</text>
  <text x="520" y="222" font-family="system-ui, sans-serif" font-size="12" fill="#34d399">↑ Top 5% globally</text>

  <!-- Main chart area -->
  <rect x="60" y="265" width="440" height="260" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <text x="84" y="298" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Tickets Over Time</text>
  <!-- Chart lines -->
  <polyline points="84,480 144,450 204,460 264,420 324,400 384,370 444,355 484,345" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="84,490 144,475 204,480 264,455 324,445 384,425 444,415 484,405" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area fill -->
  <polygon points="84,480 144,450 204,460 264,420 324,400 384,370 444,355 484,345 484,500 84,500" fill="#6366f1" opacity="0.08"/>
  <!-- Y-axis labels -->
  <text x="68" y="355" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">5k</text>
  <text x="68" y="420" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">2k</text>
  <text x="68" y="490" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">0</text>
  <!-- X-axis labels -->
  <text x="84" y="515" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Jan</text>
  <text x="184" y="515" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Mar</text>
  <text x="284" y="515" font-family="system-ui, sans-serif" font-size="11" fill="#475569">May</text>
  <text x="384" y="515" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Jul</text>
  <text x="460" y="515" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Sep</text>

  <!-- AI Activity panel -->
  <rect x="520" y="265" width="220" height="260" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <text x="540" y="298" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">AI Activity</text>
  <!-- Progress items -->
  <text x="540" y="332" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Auto-resolved</text>
  <rect x="540" y="338" width="160" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="338" width="110" height="6" rx="3" fill="#6366f1"/>
  <text x="704" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">68%</text>

  <text x="540" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Escalated</text>
  <rect x="540" y="378" width="160" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="378" width="50" height="6" rx="3" fill="#22d3ee"/>
  <text x="704" y="386" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">20%</text>

  <text x="540" y="412" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Pending</text>
  <rect x="540" y="418" width="160" height="6" rx="3" fill="#334155"/>
  <rect x="540" y="418" width="19" height="6" rx="3" fill="#f59e0b"/>
  <text x="704" y="426" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">12%</text>

  <!-- Donut chart simplified -->
  <circle cx="620" cy="487" r="36" fill="none" stroke="#334155" stroke-width="14"/>
  <circle cx="620" cy="487" r="36" fill="none" stroke="#6366f1" stroke-width="14" stroke-dasharray="155 71" stroke-dashoffset="0" transform="rotate(-90 620 487)"/>
  <circle cx="620" cy="487" r="36" fill="none" stroke="#22d3ee" stroke-width="14" stroke-dasharray="45 181" stroke-dashoffset="-155" transform="rotate(-90 620 487)"/>
  <text x="620" y="491" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">68%</text>
  <text x="620" y="505" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">AI rate</text>

  <!-- Conversation list / inbox preview -->
  <rect x="60" y="550" width="440" height="300" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <text x="84" y="583" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Recent Tickets</text>

  <!-- Ticket rows -->
  <g transform="translate(84, 595)">
    <!-- Row 1 -->
    <circle cx="16" cy="20" r="14" fill="#6366f1" opacity="0.3"/>
    <text x="16" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">JK</text>
    <text x="42" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f8fafc">Jessica K.</text>
    <text x="42" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Can't access my account after password reset</text>
    <rect x="310" y="10" width="68" height="20" rx="10" fill="#22c55e" opacity="0.15"/>
    <text x="344" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">Resolved</text>
    <rect x="0" y="44" width="390" height="1" fill="#1e3a5f" opacity="0.5"/>

    <!-- Row 2 -->
    <circle cx="16" cy="68" r="14" fill="#22d3ee" opacity="0.2"/>
    <text x="16" y="73" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle">TM</text>
    <text x="42" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f8fafc">Tom M.</text>
    <text x="42" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Billing discrepancy on last invoice</text>
    <rect x="310" y="58" width="68" height="20" rx="10" fill="#6366f1" opacity="0.2"/>
    <text x="344" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">AI Active</text>
    <rect x="0" y="92" width="390" height="1" fill="#1e3a5f" opacity="0.5"/>

    <!-- Row 3 -->
    <circle cx="16" cy="116" r="14" fill="#f59e0b" opacity="0.2"/>
    <text x="16" y="121" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fcd34d" text-anchor="middle">SR</text>
    <text x="42" y="113" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f8fafc">Sara R.</text>
    <text x="42" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Integration with Shopify not syncing</text>
    <rect x="310" y="106" width="68" height="20" rx="10" fill="#f59e0b" opacity="0.15"/>
    <text x="344" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Pending</text>
    <rect x="0" y="140" width="390" height="1" fill="#1e3a5f" opacity="0.5"/>

    <!-- Row 4 -->
    <circle cx="16" cy="164" r="14" fill="#34d399" opacity="0.2"/>
    <text x="16" y="169" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">AP</text>
    <text x="42" y="161" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f8fafc">Alex P.</text>
    <text x="42" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">How do I export my data to CSV?</text>
    <rect x="310" y="154" width="68" height="20" rx="10" fill="#22c55e" opacity="0.15"/>
    <text x="344" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">Resolved</text>
  </g>

  <!-- Countries badge -->
  <rect x="520" y="550" width="220" height="300" rx="14" fill="#1e293b" filter="url(#shadow)"/>
  <text x="540" y="583" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Global Reach</text>
  <text x="630" y="680" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" text-anchor="middle">70+</text>
  <text x="630" y="705" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Countries served</text>
  <!-- Globe icon simplified -->
  <circle cx="630" cy="760" r="50" fill="none" stroke="#334155" stroke-width="2"/>
  <ellipse cx="630" cy="760" rx="25" ry="50" fill="none" stroke="#334155" stroke-width="1.5"/>
  <line x1="580" y1="760" x2="680" y2="760" stroke="#334155" stroke-width="1.5"/>
  <line x1="580" y1="740" x2="680" y2="740" stroke="#334155" stroke-width="1"/>
  <line x1="580" y1="780" x2="680" y2="780" stroke="#334155" stroke-width="1"/>
  <circle cx="630" cy="760" r="50" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="80 234" opacity="0.6"/>
  <!-- Dots on globe -->
  <circle cx="600" cy="740" r="4" fill="#22d3ee"/>
  <circle cx="650" cy="755" r="3" fill="#6366f1"/>
  <circle cx="618" cy="775" r="3.5" fill="#34d399"/>
  <circle cx="642" cy="740" r="3" fill="#f59e0b"/>

  <!-- Bottom accent bar -->
  <rect x="60" y="870" width="680" height="3" rx="2" fill="url(#card1)" opacity="0.5"/>
</svg>
