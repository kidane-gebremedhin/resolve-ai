<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="growthLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.15"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg3)"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="100" r="150" fill="#6366f1" opacity="0.05"/>
  <circle cx="100" cy="700" r="160" fill="#22d3ee" opacity="0.06"/>

  <!-- Title area -->
  <text x="400" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Our Journey</text>
  <rect x="180" y="82" width="440" height="2" rx="1" fill="url(#accent3)" opacity="0.4"/>

  <!-- Timeline line -->
  <line x1="120" y1="150" x2="680" y2="150" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Milestone dots on timeline -->
  <circle cx="160" cy="150" r="10" fill="url(#accent3)" filter="url(#softShadow)"/>
  <circle cx="310" cy="150" r="10" fill="#22d3ee" filter="url(#softShadow)"/>
  <circle cx="460" cy="150" r="10" fill="#34d399" filter="url(#softShadow)"/>
  <circle cx="620" cy="150" r="12" fill="url(#accent3)" filter="url(#softShadow)"/>
  <circle cx="620" cy="150" r="18" fill="#6366f1" opacity="0.2"/>

  <!-- Timeline labels -->
  <text x="160" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">2019</text>
  <text x="310" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#06b6d4" text-anchor="middle">2020</text>
  <text x="460" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981" text-anchor="middle">2022</text>
  <text x="620" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6366f1" text-anchor="middle">Today</text>

  <!-- Milestone cards -->
  <!-- 2019 Founded -->
  <rect x="80" y="200" width="160" height="130" rx="14" fill="white" filter="url(#cardShadow)"/>
  <rect x="80" y="200" width="160" height="4" rx="2" fill="url(#accent3)"/>
  <text x="100" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">2019</text>
  <text x="100" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Founded</text>
  <text x="100" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" xml:space="preserve">Small team obsessed</text>
  <text x="100" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">with faster support</text>
  <text x="100" y="316" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#6366f1">5</text>
  <text x="118" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8"> engineers</text>

  <!-- 2020 First product -->
  <rect x="228" y="200" width="168" height="130" rx="14" fill="white" filter="url(#cardShadow)"/>
  <rect x="228" y="200" width="168" height="4" rx="2" fill="#22d3ee"/>
  <text x="248" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">2020</text>
  <text x="248" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Public Launch</text>
  <text x="248" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">First 50 customers</text>
  <text x="248" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">onboard in week one</text>
  <text x="248" y="316" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#06b6d4">50</text>
  <text x="274" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8"> customers</text>

  <!-- 2022 Scale -->
  <rect x="378" y="200" width="163" height="130" rx="14" fill="white" filter="url(#cardShadow)"/>
  <rect x="378" y="200" width="163" height="4" rx="2" fill="#34d399"/>
  <text x="398" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">2022</text>
  <text x="398" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Scale Up</text>
  <text x="398" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Enterprise plans and</text>
  <text x="398" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">global expansion</text>
  <text x="398" y="316" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#10b981">70+</text>
  <text x="432" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8"> countries</text>

  <!-- Today -->
  <rect x="534" y="195" width="186" height="140" rx="14" fill="url(#accent3)" filter="url(#softShadow)"/>
  <text x="554" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#c7d2fe">Today</text>
  <text x="554" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">AI Platform</text>
  <text x="554" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">Full AI customer</text>
  <text x="554" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#e0e7ff">support at scale</text>
  <text x="554" y="316" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">150+</text>
  <text x="594" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#c7d2fe"> enterprise clients</text>

  <!-- Growth chart section -->
  <rect x="60" y="365" width="680" height="260" rx="16" fill="white" filter="url(#cardShadow)"/>
  <text x="84" y="398" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Revenue Growth</text>
  <text x="84" y="418" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Year-over-year performance</text>

  <!-- Chart background grid -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="84" y1="450" x2="716" y2="450"/>
    <line x1="84" y1="475" x2="716" y2="475"/>
    <line x1="84" y1="500" x2="716" y2="500"/>
    <line x1="84" y1="525" x2="716" y2="525"/>
    <line x1="84" y1="550" x2="716" y2="550"/>
    <line x1="84" y1="575" x2="716" y2="575"/>
    <line x1="84" y1="600" x2="716" y2="600"/>
  </g>

  <!-- Bar chart -->
  <!-- 2019 -->
  <rect x="120" y="573" width="60" height="27" rx="6" fill="#e0e7ff"/>
  <text x="150" y="615" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2019</text>
  <!-- 2020 -->
  <rect x="220" y="543" width="60" height="57" rx="6" fill="#c7d2fe"/>
  <text x="250" y="615" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2020</text>
  <!-- 2021 -->
  <rect x="320" y="503" width="60" height="97" rx="6" fill="#a5b4fc"/>
  <text x="350" y="615" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2021</text>
  <!-- 2022 -->
  <rect x="420" y="463" width="60" height="137" rx="6" fill="#818cf8"/>
  <text x="450" y="615" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2022</text>
  <!-- 2023 -->
  <rect x="520" y="433" width="60" height="167" rx="6" fill="#6366f1"/>
  <text x="550" y="615" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2023</text>
  <!-- 2024 -->
  <rect x="620" y="453" width="60" height="147" rx="6" fill="url(#accent3)" filter="url(#softShadow)"/>
  <text x="650" y="615" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2024</text>

  <!-- Growth line overlay -->
  <polyline points="150,573 250,543 350,503 450,463 550,433 650,453" fill="none" stroke="url(#growthLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="573" r="4" fill="#6366f1"/>
  <circle cx="250" cy="543" r="4" fill="#6366f1"/>
  <circle cx="350" cy="503" r="4" fill="#6366f1"/>
  <circle cx="450" cy="463" r="4" fill="#6366f1"/>
  <circle cx="550" cy="433" r="5" fill="#6366f1"/>
  <circle cx="650" cy="453" r="5" fill="#6366f1"/>

  <!-- Achievement badges row -->
  <rect x="60" y="655" width="210" height="100" rx="14" fill="white" filter="url(#cardShadow)"/>
  <circle cx="100" cy="700" r="22" fill="#6366f1" opacity="0.1"/>
  <text x="100" y="706" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🏆</text>
  <text x="132" y="694" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">G2 Leader</text>
  <text x="132" y="710" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">4 years running</text>
  <text x="132" y="726" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">in AI Support</text>

  <rect x="294" y="655" width="212" height="100" rx="14" fill="white" filter="url(#cardShadow)"/>
  <circle cx="334" cy="700" r="22" fill="#22d3ee" opacity="0.1"/>
  <text x="334" y="706" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⚡</text>
  <text x="368" y="694" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">99.9% Uptime</text>
  <text x="368" y="710" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Enterprise-grade</text>
  <text x="368" y="726" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">reliability</text>

  <rect x="529" y="655" width="211" height="100" rx="14" fill="white" filter="url(#cardShadow)"/>
  <circle cx="568" cy="700" r="22" fill="#34d399" opacity="0.1"/>
  <text x="568" y="706" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🌍</text>
  <text x="602" y="694" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2.18M+</text>
  <text x="602" y="710" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Tickets resolved</text>
  <text x="602" y="726" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">automatically</text>
</svg>
