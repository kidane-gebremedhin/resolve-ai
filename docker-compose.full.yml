name: csb-full

services:
  mongo:
    extends:
      file: docker-compose.yml
      service: mongo
  redis:
    extends:
      file: docker-compose.yml
      service: redis
  mailhog:
    extends:
      file: docker-compose.yml
      service: mailhog

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ['.env']
    ports: ['4000:4000']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # NOTE on URLs: NEXT_PUBLIC_* are baked into the browser bundle at BUILD time,
  # so they're passed as build.args and must be reachable from the HOST browser
  # (localhost). Server-side fetches inside the container use API_INTERNAL_URL
  # (the api service over the compose network) at runtime.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # All NEXT_PUBLIC_* are read from .env at build time (baked into the client
      # bundle). Required ones use ${VAR:?…} so compose FAILS with a clear error
      # if they're missing; Paddle vars are optional (checkout shows "not
      # configured" when the token is empty).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?set NEXT_PUBLIC_SOCKET_URL in .env}
        NEXT_PUBLIC_WIDGET_URL: ${NEXT_PUBLIC_WIDGET_URL:?set NEXT_PUBLIC_WIDGET_URL in .env}
        NEXT_PUBLIC_EMBED_URL: ${NEXT_PUBLIC_EMBED_URL:?set NEXT_PUBLIC_EMBED_URL in .env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Helio}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN-}
        NEXT_PUBLIC_PADDLE_ENV: ${NEXT_PUBLIC_PADDLE_ENV-}
    env_file: ['.env']
    environment:
      # PORT/HOSTNAME are per-service constants (NOT from .env, whose PORT=4000
      # is the API's): the standalone server listens here and binds all
      # interfaces (Docker otherwise sets HOSTNAME to the container id).
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: ${API_INTERNAL_URL:?set API_INTERNAL_URL in .env (e.g. http://api:4000/api/v1)}
      # Each Next app needs its OWN NEXTAUTH_URL (the root .env's is the web app's).
      # The admin app on :3003 must NOT inherit :3000, or its Google OAuth callback
      # lands on the web app → state-cookie mismatch → ?error=Configuration.
      NEXTAUTH_URL: http://localhost:3000
    ports: ['3000:3000']
    depends_on: [api]
    restart: unless-stopped

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?set NEXT_PUBLIC_SOCKET_URL in .env}
        # Branding for the widget's "Powered by <name>" attribution.
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Helio}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file: ['.env']
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports: ['3001:3001']
    depends_on: [api]
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?set NEXT_PUBLIC_SOCKET_URL in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Helio}
    env_file: ['.env']
    environment:
      PORT: 3003
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: ${API_INTERNAL_URL:?set API_INTERNAL_URL in .env (e.g. http://api:4000/api/v1)}
      # The admin portal's own callback origin (NOT the web app's :3000).
      NEXTAUTH_URL: http://localhost:3003
    ports: ['3003:3003']
    depends_on: [api]
    restart: unless-stopped

  embed:
    build:
      context: .
      dockerfile: apps/embed/Dockerfile
    ports: ['3002:80']
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
