name: csb-full

services:
  # Infra is inlined here (NOT `extends: docker-compose.yml`) so the file is
  # self-contained: Coolify's compose preprocessing doesn't resolve cross-file
  # `extends` volume definitions, which surfaced as
  # "service mongo refers to undefined volume mongo-data". Keep in sync with the
  # dev infra in docker-compose.yml. No `container_name` — the orchestrator
  # (Coolify) manages container names.
  mongo:
    image: mongo:7
    restart: unless-stopped
    # `expose` (not `ports`) — reachable on the compose network for the API and
    # Coolify's proxy, but NOT published on the host. (For local host access run
    # `pnpm dev` + `pnpm dev:infra`, which use docker-compose.yml with `ports`.)
    expose: ['27017']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-customer-support}
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose: ['6379']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: sh -c 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    expose:
      - '1025'
      - '8025'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ['.env']
    expose: ['4000']
    # Persist local-disk attachment uploads across redeploys. (A fresh named
    # volume inherits the image's /app/uploads ownership → writable by `app`.)
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # NOTE on URLs: NEXT_PUBLIC_* are baked into the browser bundle at BUILD time,
  # so they're passed as build.args and must be reachable from the visitor's
  # browser — the PUBLIC domain in production (e.g. the Coolify-generated
  # http://<service>.sslip.io), or localhost for dev:full. Server-side fetches
  # inside the container use API_INTERNAL_URL (the api service over the compose
  # network) at runtime.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # All NEXT_PUBLIC_* are read from .env at build time (baked into the client
      # bundle). Required ones use ${VAR:?…} so compose FAILS with a clear error
      # if they're missing; Paddle vars are optional (checkout shows "not
      # configured" when the token is empty).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?set NEXT_PUBLIC_SOCKET_URL in .env}
        NEXT_PUBLIC_WIDGET_URL: ${NEXT_PUBLIC_WIDGET_URL:?set NEXT_PUBLIC_WIDGET_URL in .env}
        NEXT_PUBLIC_EMBED_URL: ${NEXT_PUBLIC_EMBED_URL:?set NEXT_PUBLIC_EMBED_URL in .env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Chataxis}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN-}
        NEXT_PUBLIC_PADDLE_ENV: ${NEXT_PUBLIC_PADDLE_ENV-}
    env_file: ['.env']
    environment:
      # PORT/HOSTNAME are per-service constants (NOT from .env, whose PORT=4000
      # is the API's): the standalone server listens here and binds all
      # interfaces (Docker otherwise sets HOSTNAME to the container id).
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: ${API_INTERNAL_URL:?set API_INTERNAL_URL in .env (e.g. http://api:4000/api/v1)}
      # Each Next app needs its OWN NEXTAUTH_URL (web and admin differ). Override
      # per-deployment: set WEB_NEXTAUTH_URL to the web app's public origin in
      # Coolify (e.g. http://<web-domain>); defaults to localhost for dev:full.
      NEXTAUTH_URL: ${WEB_NEXTAUTH_URL:-http://localhost:3000}
    expose: ['3000']
    depends_on: [api]
    restart: unless-stopped

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?set NEXT_PUBLIC_SOCKET_URL in .env}
        # Branding for the widget's "Powered by <name>" attribution.
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Chataxis}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file: ['.env']
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    expose: ['3001']
    depends_on: [api]
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?set NEXT_PUBLIC_SOCKET_URL in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Chataxis}
    env_file: ['.env']
    environment:
      PORT: 3003
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: ${API_INTERNAL_URL:?set API_INTERNAL_URL in .env (e.g. http://api:4000/api/v1)}
      # The admin portal's own callback origin (NOT the web app's). Override with
      # ADMIN_NEXTAUTH_URL in Coolify (e.g. http://<admin-domain>); defaults to
      # localhost for dev:full.
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL:-http://localhost:3003}
    expose: ['3003']
    depends_on: [api]
    restart: unless-stopped

  embed:
    build:
      context: .
      dockerfile: apps/embed/Dockerfile
    expose: ['80']
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  uploads-data:
