name: release-images
on:
  push:
    branches: [main, staging, dev]

permissions:
  contents: read
  packages: write
  id-token: write   # for cosign keyless

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, widget, embed, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/csb-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=raw,value=${{ github.ref_name }}-${{ github.run_number }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/csb-${{ matrix.app }}@${{ steps.build.outputs.digest }}

      - name: Notify Coolify
        if: ${{ secrets.COOLIFY_WEBHOOK_URL != '' }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -fsSL -X POST "$COOLIFY_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"app\":\"${{ matrix.app }}\",\"branch\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\"}"
